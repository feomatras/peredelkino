<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Переделкино</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center;">
            <div class="logo">Переделкино <span>🏠</span></div>
        </a>
        <nav class="header-nav">
            <div class="city-selector">
                <span>📍</span>
                <select id="citySelect">
                    <option value="moscow">Москва</option>
                    <option value="novosibirsk">Новосибирск</option>
                </select>
            </div>
            <a href="catalog.html">Каталог</a>
            <a href="profile.html" class="profile-icon" title="Личный кабинет">👤</a>
            <a href="cart.html" class="cart-icon">
                🛒 <span class="badge">0</span>
            </a>
        </nav>
    </header>

    <div class="container">
        <h1>Корзина</h1>

        <div id="cart-items">
            <p>Корзина пуста.</p>
        </div>

        <div class="promo-section">
            <input type="text" id="promo-input" placeholder="Введите промокод (FIRST)">
            <button class="btn btn-primary" onclick="applyPromo()">Применить</button>
        </div>

        <div class="cart-total" id="cart-total">
            Итого: 0 ₽
        </div>

        <div class="min-sum-warning" id="min-sum-warning">
            ⚠️ Минимальная сумма заказа для доставки — 1000 ₽. Добавьте товары или выберите самовывоз.
        </div>

        <div class="cart-actions">
            <button class="btn btn-secondary" onclick="if(confirm('Очистить корзину?')){cart=[];saveCart();renderCart();updateCartBadge();}">🗑️ Удалить все</button>
            <a href="checkout.html" class="btn btn-primary" style="padding: 12px 40px; font-size: 18px;">💳 Оплатить</a>
        </div>

        <div style="margin-top: 16px; text-align: right;">
            <a href="catalog.html" style="color: #e67e22;">← Продолжить покупки</a>
        </div>
    </div>

    <button class="chat-button" onclick="openChat()">💬</button>

    <div class="chat-modal" id="chatModal">
        <div class="chat-header">
            💬 Консультант Мария
            <span class="close-chat" onclick="closeChat()">×</span>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="message bot">Здравствуйте! Чем могу помочь?</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
