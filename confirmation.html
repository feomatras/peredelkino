<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ оформлен — Переделкино</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center;">
            <div class="logo">Переделкино <span>🏠</span></div>
        </a>
        <nav class="header-nav">
            <div class="city-selector">
                <span>📍</span>
                <select id="citySelect">
                    <option value="moscow">Москва</option>
                    <option value="novosibirsk">Новосибирск</option>
                </select>
            </div>
            <a href="catalog.html">Каталог</a>
            <a href="profile.html" class="profile-icon" title="Личный кабинет">👤</a>
            <a href="cart.html" class="cart-icon">
                🛒 <span class="badge">0</span>
            </a>
        </nav>
    </header>

    <div class="container">
        <div class="confirmation-box">
            <div style="font-size: 48px; margin-bottom: 16px;">✅</div>
            <h2>Заказ оформлен!</h2>
            <div style="margin: 16px 0; font-size: 18px; color: #666;">
                Номер заказа: <span class="order-number" id="order-number">1001</span>
            </div>
            <div class="message">
                <p>На ваш номер телефона и email отправлена ссылка для подтверждения заказа.</p>
                <p style="font-weight: 500;">Перейдите по ссылке, чтобы завершить оформление.</p>
            </div>
            <button class="btn btn-primary" style="padding: 12px 40px; font-size: 16px;" onclick="alert('✅ Заказ подтверждён! Спасибо за покупку.')">
                🔗 Подтвердить заказ
            </button>
            <div style="margin-top: 20px;">
                <a href="index.html" style="color: #e67e22;">← На главную</a>
            </div>
        </div>
    </div>

    <button class="chat-button" onclick="openChat()">💬</button>

    <div class="chat-modal" id="chatModal">
        <div class="chat-header">
            💬 Консультант Мария
            <span class="close-chat" onclick="closeChat()">×</span>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="message bot">Здравствуйте! Чем могу помочь?</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
